<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glance photos</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="glance-build" content="__GLANCE_BUILD__" />
    <link rel="stylesheet" href="/glance/photos.css?v=__GLANCE_BUILD__" />
    <link rel="stylesheet" href="/glance/gallery.css?v=__GLANCE_BUILD__" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <a class="back" href="/glance/">Back to Glance</a>
        <h1>Photos</h1>
        <p class="hint">Choose pictures from your phone. Crop each one to the landscape frame, then it is saved as a 4:3 JPEG.</p>
      </header>
      <form id="login" class="login" hidden>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">Enter</button>
      </form>
      <section id="library" hidden>
        <label class="pick">
          Add photos
          <input id="files" type="file" accept="image/*" multiple />
        </label>
        <p id="status" class="status" role="status"></p>
        <h2 id="manage-title">Manage photos</h2>
        <p><button type="button" data-share>Share photos via QR</button></p>
        <p id="empty" class="empty">No photos yet. Add a few and the kitchen board can show them after it sits untouched.</p>
        <ul id="gallery-grid" class="gallery-grid"></ul>
      </section>
      <section id="crop" class="crop" hidden>
        <p id="crop-count" class="crop-count">Crop</p>
        <div id="crop-stage" class="crop-stage"><canvas id="crop-view"></canvas></div>
        <label class="crop-zoom">Zoom
          <input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" />
        </label>
        <p id="crop-status" class="crop-status" role="status"></p>
        <div class="crop-rot">
          <button id="crop-left" type="button">Rotate left</button>
          <button id="crop-right" type="button">Rotate right</button>
        </div>
        <div class="crop-actions">
          <button id="crop-cancel" type="button">Cancel</button>
          <button id="crop-skip" type="button">Skip</button>
          <button id="crop-save" type="button">Save</button>
        </div>
      </section>
      <section id="viewer" class="viewer" hidden aria-label="Photo">
        <div class="viewer-frame"><img id="viewer-img" alt="" /></div>
        <div class="viewer-side">
          <h2>Photo</h2>
          <div class="viewer-actions">
            <button id="viewer-back" type="button">Back</button>
            <button id="viewer-recrop" type="button">Re-crop</button>
            <button id="viewer-left" type="button">Rotate left</button>
            <button id="viewer-right" type="button">Rotate right</button>
            <button id="viewer-delete" class="viewer-delete" type="button">Delete</button>
          </div>
          <p id="viewer-credit" class="viewer-credit" hidden></p>
          <p id="viewer-confirm" class="viewer-confirm" hidden>
            Delete this photo?
            <button id="viewer-yes" type="button">Delete</button>
            <button id="viewer-no" type="button">Keep</button>
          </p>
          <p id="viewer-status" class="viewer-status" role="status"></p>
        </div>
      </section>
    </main>
    <script src="/glance/crop.js?v=__GLANCE_BUILD__" defer></script>
    <script src="/glance/share.js?v=__GLANCE_BUILD__" defer></script>
    <script src="/glance/gallery.js?v=__GLANCE_BUILD__" defer></script>
    <script src="/glance/photos.js?v=__GLANCE_BUILD__" defer></script>
  </body>
</html>
