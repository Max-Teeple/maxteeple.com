<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glance</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glance" />
    <meta name="glance-build" content="__GLANCE_BUILD__" />
    <link rel="manifest" href="/glance/manifest.webmanifest" />
    <link rel="canonical" href="https://maxteeple.com/glance/" />
    <link rel="icon" href="/glance/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/glance/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="/glance/app.css?v=__GLANCE_BUILD__" />
    <link rel="stylesheet" href="/glance/gallery.css?v=__GLANCE_BUILD__" />
  </head>
  <body data-theme="aurora" data-layout="fiveday">
    <div id="boot" class="boot" role="status" aria-live="polite">
      <p class="boot-mark">Glance</p>
      <p class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></p>
      <p class="boot-line">Loading your board…</p>
    </div>

    <main id="login" class="login" hidden>
      <form id="login-form" class="glass login-card" method="post" action="/glance/api/login">
        <p class="eyebrow">Kitchen</p>
        <h1>Glance</h1>
        <label class="field">
          <span>Password</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="primary" type="submit">Enter</button>
      </form>
    </main>

    <p class="privacy-public"><a href="/glance/privacy.html">Privacy policy</a></p>

    <div id="board" class="app" hidden>
      <header class="top">
        <section class="clock-block">
          <p id="place" class="place">Phoenix</p>
          <p class="clock">
            <span id="time">–:–</span>
            <span id="ampm"></span>
          </p>
          <p id="date" class="date"></p>
          <p id="next-line" class="next-line" hidden></p>
          <p id="party" class="party" hidden role="status"></p>
          <p id="summary" class="summary"></p>
        </section>
        <section id="now" class="now-card glass" aria-label="Current weather"></section>
        <section id="forecast" class="forecast" aria-label="Week forecast"></section>
      </header>
      <section id="hourly" class="hourly" aria-label="Next hours"></section>
      <div class="lower">
        <section id="days" class="days" aria-label="Agenda"></section>
        <aside id="rail" class="rail"></aside>
      </div>
      <div class="tools">
        <button id="photo-open" type="button" aria-label="Photos" title="Photos" aria-expanded="false" aria-controls="photo-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.4" fill="currentColor"/><path d="M7 16.5 10.5 13l2.2 2.2L16 12l3 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
        <div id="photo-menu" class="photo-menu" hidden>
          <button id="photo-start" type="button">Start slideshow</button>
          <button id="photo-add" type="button">Add photos</button>
          <button id="photo-manage" type="button">Manage photos</button>
        </div>
        <input id="photo-files" type="file" accept="image/*" multiple hidden />
        <button id="week-open" type="button" aria-label="Week view" title="Week view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="layout-next" type="button" aria-label="Next layout" title="Next layout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="16" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button id="full" type="button" aria-label="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="gear" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <section id="slides" class="slides" hidden aria-label="Photo slideshow">
      <img id="slide-a" alt="" decoding="async">
      <img id="slide-b" alt="" decoding="async">
      <div class="slide-scrim">
        <p class="slide-when"><span id="slide-time"></span><span id="slide-date"></span></p>
        <p id="slide-banner" class="slide-banner" hidden></p>
      </div>
      <button id="slide-back" type="button" aria-label="Back to calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="slide-tools">
        <button id="slide-manage" type="button">Manage photos</button>
        <button id="slide-add" type="button">Add photos</button>
      </div>
    </section>
    <section id="crop" class="crop" hidden>
      <p id="crop-count" class="crop-count">Crop</p>
      <div id="crop-stage" class="crop-stage"><canvas id="crop-view"></canvas></div>
      <label class="crop-zoom">Zoom
        <input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" />
      </label>
        <p id="crop-status" class="crop-status" role="status"></p>
        <div class="crop-rot">
          <button id="crop-left" type="button">Rotate left</button>
          <button id="crop-right" type="button">Rotate right</button>
        </div>
        <div class="crop-actions">
        <button id="crop-cancel" type="button">Cancel</button>
        <button id="crop-skip" type="button">Skip</button>
        <button id="crop-save" type="button">Save</button>
      </div>
    </section>
    <section id="gallery" class="gallery" hidden aria-label="Manage photos">
      <div class="gallery-bar">
        <button id="gallery-close" type="button">Back</button>
        <h2>Manage photos</h2>
      </div>
      <p id="gallery-empty" class="empty">No photos yet.</p>
      <ul id="gallery-grid" class="gallery-grid"></ul>
    </section>
    <section id="viewer" class="viewer" hidden aria-label="Photo">
      <div class="viewer-frame"><img id="viewer-img" alt="" /></div>
      <div class="viewer-side">
        <h2>Photo</h2>
        <div class="viewer-actions">
          <button id="viewer-back" type="button">Back</button>
          <button id="viewer-recrop" type="button">Re-crop</button>
          <button id="viewer-left" type="button">Rotate left</button>
          <button id="viewer-right" type="button">Rotate right</button>
          <button id="viewer-delete" class="viewer-delete" type="button">Delete</button>
        </div>
        <p id="viewer-confirm" class="viewer-confirm" hidden>
          Delete this photo?
          <button id="viewer-yes" type="button">Delete</button>
          <button id="viewer-no" type="button">Keep</button>
        </p>
        <p id="viewer-status" class="viewer-status" role="status"></p>
      </div>
    </section>

    <template id="week-template">
    <section id="week" class="week" hidden aria-label="Week view">
      <header class="week-bar">
        <button id="week-back" type="button">Back</button>
        <button id="week-prev" type="button" aria-label="Previous week">‹</button>
        <h2 id="week-title">This week</h2>
        <button id="week-next" type="button" aria-label="Next week">›</button>
        <button id="week-this" type="button">This week</button>
      </header>
      <div id="week-days" class="week-days"></div>
    </section>
    </template>

    <template id="settings-template">
    <div id="settings" class="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <form id="settings-form" class="settings-card glass">
        <header class="settings-head">
          <div>
            <p class="eyebrow">Settings</p>
            <h2 id="settings-title">Glance</h2>
          </div>
          <button id="settings-close" type="button" class="icon-btn" aria-label="Close">×</button>
        </header>
        <div class="settings-body">
          <section>
            <h3>Calendars</h3>
            <p class="hint">Private ICS links stay on the server. This screen never shows a saved link again.</p>
            <div id="feed-list" class="feed-list"></div>
            <button id="add-feed" type="button" class="text-btn">Add calendar</button>
          </section>
          <section>
            <h3>Lights</h3>
            <p class="hint">Tuya cloud keys stay on the server. A saved key is never shown again.</p>
            <label class="field">Access ID
              <input id="tuya-id" type="password" autocomplete="off" spellcheck="false" />
            </label>
            <label class="field">Access secret
              <input id="tuya-secret" type="password" autocomplete="off" spellcheck="false" />
            </label>
            <div id="light-list" class="feed-list"></div>
          </section>
          <section>
            <h3>Google Calendar</h3>
            <p id="google-status" class="hint">Connect Google to add events on the personal calendar.</p>
            <p>
              <a id="google-connect" class="text-btn" href="/glance/api/google/start">Connect Google Calendar</a>
              <button id="google-disconnect" type="button" class="text-btn danger" hidden>Disconnect</button>
            </p>
            <p class="hint">Leave these blank when the client is already stored as a Worker secret. A saved value is never shown again.</p>
            <label class="field">Client ID
              <input id="google-client-id" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" />
            </label>
            <label class="field">Client secret
              <input id="google-client-secret" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" />
            </label>
          </section>
          <section>
            <h3>Family</h3>
            <p class="hint">Phone locations stay on this server. A device token is shown only when you create or replace it.</p>
            <label class="field">Home address
              <input id="home-address" autocomplete="off" placeholder="Street, city" />
            </label>
            <div class="split">
              <label class="field">Latitude <input id="home-lat" inputmode="decimal" /></label>
              <label class="field">Longitude <input id="home-lon" inputmode="decimal" /></label>
              <label class="field">Radius (m) <input id="home-radius" inputmode="numeric" value="120" /></label>
            </div>
            <button id="save-home" type="button" class="text-btn">Save home</button>
            <div id="place-list" class="feed-list"></div>
            <button id="add-place" type="button" class="text-btn">Add place</button>
            <label class="field">Show last seen after
              <input id="stale-hours" inputmode="numeric" value="6" />
            </label>
            <button id="save-places" type="button" class="text-btn">Save places</button>
            <div id="people-list" class="feed-list"></div>
            <div class="split">
              <label class="field">Name <input id="person-name" maxlength="40" placeholder="Max" /></label>
            </div>
            <button id="add-person" type="button" class="text-btn">Add person</button>
            <div id="person-setup" class="setup-box" hidden></div>
          </section>
          <section class="split">
            <label class="field">Place <input id="set-place" name="locationName" autocomplete="off" /></label>
            <label class="field">Latitude <input id="set-lat" name="lat" inputmode="decimal" /></label>
            <label class="field">Longitude <input id="set-lon" name="lon" inputmode="decimal" /></label>
          </section>
          <section>
            <h3>Layout</h3>
            <div id="layouts" class="layouts" role="radiogroup" aria-label="Layout"></div>
          </section>
          <section>
            <h3>Scene</h3>
            <div id="themes" class="themes" role="radiogroup" aria-label="Background"></div>
          </section>
          <section class="split">
            <label class="check"><input id="set-24" type="checkbox" /> 24-hour clock</label>
            <label class="field">Dim from
              <select id="set-night-start"></select>
            </label>
            <label class="field">until
              <select id="set-night-end"></select>
            </label>
          </section>
          <section>
            <h3>Widgets</h3>
            <div class="checks">
              <label class="check"><input id="w-summary" type="checkbox" /> Today at a glance</label>
              <label class="check"><input id="w-count" type="checkbox" /> Next event</label>
              <label class="check"><input id="w-sun" type="checkbox" /> Sunrise and sunset</label>
              <label class="check"><input id="w-air" type="checkbox" /> Air quality</label>
              <label class="check"><input id="w-lights" type="checkbox" /> Lights</label>
              <label class="check"><input id="w-family" type="checkbox" /> Family</label>
            </div>
          </section>
          <p id="settings-error" class="form-error" role="alert"></p>
          <button class="primary" type="submit">Save</button>
          <section class="password-block">
            <h3>Password</h3>
            <label class="field">Current <input id="pw-current" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
            <label class="field">New <input id="pw-next" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" /></label>
            <button id="pw-save" type="button" class="text-btn">Change password</button>
            <p id="pw-msg" class="hint" role="status"></p>
          </section>
          <button id="sign-out" type="button" class="text-btn danger">Sign out</button>
          <p class="hint credit">Weather and air quality come from Open-Meteo.</p>
        </div>
      </form>
    </div>
    </template>
    <script src="/glance/crop.js?v=__GLANCE_BUILD__" defer></script>
    <script src="/glance/gallery.js?v=__GLANCE_BUILD__" defer></script>
    <script src="/glance/app.js?v=__GLANCE_BUILD__" defer></script>
  </body>
</html>
