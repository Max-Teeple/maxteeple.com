<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4511e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LiveView">
    <title>Course Stream - LiveView Golf</title>
    <meta name="description" content="Watch live golf from this course on LiveView Golf.">
    <meta property="og:title" content="LiveView Golf Course">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/jpeg" href="/liveview/images/liveview-logo.svg">
    <link rel="apple-touch-icon" href="/liveview/images/liveview-logo.svg">
    <link rel="manifest" href="/liveview/manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="overlay.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=New+Amsterdam&family=Teko:wght@300..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/liveview/images/liveview-logo.svg">
</head>
<body data-nav-page="course">
    <header class="sticky-header">
        <div class="top-bar">
            <a class="site-root-link" href="https://maxteeple.com/">maxteeple.com</a>

            <a class="brand" href="index.html" aria-label="LiveView Golf home">
                <img class="brand-logo" src="/liveview/images/liveview-logo.svg" alt="LiveView Golf">
                <span class="company-name brand-wordmark">LiveView Golf</span>
            </a>
            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="index.html#streams" data-nav="streams">Streams</a>
                <a href="explore.html" data-nav="explore">Explore</a>
                <a href="#" data-nav="profile" hidden>Profile</a>
                <a href="#" data-nav="bio" hidden>My bio</a>
                <a href="index.html#about" data-nav="courses">For courses</a>
                <a href="index.html#contact" data-nav="contact">Contact</a>
            </nav>
            <div class="header-actions">
                <a href="messages.html" class="header-icon-link" id="messagesLink" title="Messages" hidden>💬</a>
                <button type="button" class="header-icon-link" id="notifBell" title="Notifications" hidden aria-label="Notifications">🔔<span id="notifCount" class="notif-badge" hidden></span></button>
                <a href="groups.html" class="header-icon-link" id="groupsLink" title="Friends & groups" hidden>👥</a>
                <a id="profileBarLink" class="profile-pill" href="#" style="display:none;">
                    <img id="profileBarImg" src="" alt="Profile">
                    <span id="profileBarName"></span>
                </a>
                <button class="login-btn" type="button" id="courseLogoutBtn">Login</button>
                <div class="menu-button">
                    <button id="menu-toggle" class="menu-btn" type="button" aria-label="Open menu">☰</button>
                    <nav id="dropdown-menu" class="dropdown-menu" aria-label="Mobile navigation">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="index.html#streams" data-nav="streams">Streams</a></li>
                            <li><a href="explore.html" data-nav="explore">Explore</a></li>
                            <li><a href="#" data-nav="profile" hidden>Profile</a></li>
                            <li><a href="#" data-nav="bio" hidden>My bio</a></li>
                            <li><a href="index.html#about" data-nav="courses">For courses</a></li>
                            <li><a href="index.html#contact" data-nav="contact">Contact</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main class="broadcast">
        <section class="broadcast-hero">
            <div class="stream-stage broadcast-player" id="streamStage">
                <video id="courseStreamPlayer" controls autoplay playsinline></video>
                <div class="lv-overlay-root" id="streamOverlay" hidden></div>
            </div>
            <div class="broadcast-meta">
                <img id="courseLogo" class="broadcast-logo" alt="" hidden>
                <div>
                    <p id="courseStreamStatus" class="broadcast-kicker">Loading</p>
                    <h1 id="courseName"></h1>
                    <p id="courseLocation" class="broadcast-loc"></p>
                    <p id="courseDescription" class="broadcast-desc"></p>
                    <p id="nextStreamLine" class="broadcast-loc" hidden></p>
                    <div id="consumerCourseActions" class="broadcast-actions" hidden>
                        <button type="button" id="favoriteCourseBtn">Favorite</button>
                        <button type="button" id="followCourseBtn">Follow</button>
                        <button type="button" id="notifyCourseBtn">Notify me</button>
                    </div>
                    <div class="broadcast-tools">
                        <button type="button" id="overlayToggle" class="overlay-toggle" hidden>Hide overlay</button>
                        <div class="seg" id="overlayTeeLabel" role="radiogroup" aria-label="Tee yardage" hidden>
                            <button type="button" role="radio" data-tee="black" aria-checked="false">Black</button>
                            <button type="button" role="radio" data-tee="blue" aria-checked="false">Blue</button>
                            <button type="button" role="radio" data-tee="white" aria-checked="true">White</button>
                            <button type="button" role="radio" data-tee="red" aria-checked="false">Red</button>
                        </div>
                    </div>
                </div>
            </div>
            <p id="noStreamMsg" class="broadcast-loc" hidden>Stream currently not live.</p>
        </section>
        <div class="broadcast-body">
            <section id="highlightsSection" class="highlights-section" hidden>
                <h2>Replays</h2>
                <div id="highlightsList" class="discover-grid"></div>
            </section>
            <aside id="watchParty" class="watch-party" hidden>
                <div class="watch-party-head">
                    <h2>Watch party</h2>
                    <button type="button" id="copyWatchLink" class="secondary-link">Copy invite</button>
                </div>
                <p id="watchHint" class="watch-hint">Chat with everyone on this stream.</p>
                <div id="watchMessages" class="watch-messages" aria-live="polite"></div>
                <form id="watchForm" class="watch-form">
                    <input id="watchInput" maxlength="500" placeholder="Say something" autocomplete="off">
                    <button type="submit" class="primary-link">Send</button>
                </form>
            </aside>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="liveview-core.js"></script>
    <script src="script.js"></script>
    <script src="site-chrome.js"></script>
    <script src="stream-player.js"></script>
    <script src="overlay.js"></script>
    <script src="course.js?v=broadcast"></script>
    <script src="sw-register.js"></script>
</body>
</html>
