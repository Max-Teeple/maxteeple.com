<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff4d18">
    <title>Explore - LiveView Golf</title>
    <link rel="icon" type="image/svg+xml" href="/liveview/images/liveview-logo.svg">
    <link rel="apple-touch-icon" href="/liveview/images/liveview-logo.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="page-explore" data-nav-page="explore">
    <header class="sticky-header">
        <div class="top-bar">
            <a class="brand" href="index.html" aria-label="LiveView Golf home">
                <img class="brand-logo" src="/liveview/images/liveview-logo.svg" alt="LiveView Golf">
                <span class="company-name brand-wordmark">LiveView Golf</span>
            </a>
            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="index.html#streams" data-nav="streams">Streams</a>
                <a href="explore.html" data-nav="explore">Explore</a>
                <a href="#" data-nav="profile" hidden>Profile</a>
                <a href="#" data-nav="bio" hidden>My bio</a>
                <a href="index.html#about" data-nav="courses">For courses</a>
                <a href="index.html#contact" data-nav="contact">Contact</a>
            </nav>
            <div class="header-actions">
                <a href="messages.html" class="header-icon-link" id="messagesLink" title="Messages" hidden>💬</a>
                <button type="button" class="header-icon-link" id="notifBell" title="Notifications" hidden aria-label="Notifications">🔔<span id="notifCount" class="notif-badge" hidden></span></button>
                <a href="groups.html" class="header-icon-link" id="groupsLink" title="Friends & groups" hidden>👥</a>
                <a id="profileBarLink" class="profile-pill" href="#" style="display:none;">
                    <img id="profileBarImg" src="" alt="Profile">
                    <span id="profileBarName"></span>
                </a>
                <button class="login-btn" type="button">Login</button>
                <div class="menu-button">
                    <button id="menu-toggle" class="menu-btn" type="button" aria-label="Open menu">☰</button>
                    <nav id="dropdown-menu" class="dropdown-menu" aria-label="Mobile navigation">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="index.html#streams" data-nav="streams">Streams</a></li>
                            <li><a href="explore.html" data-nav="explore">Explore</a></li>
                            <li><a href="#" data-nav="profile" hidden>Profile</a></li>
                            <li><a href="#" data-nav="bio" hidden>My bio</a></li>
                            <li><a href="index.html#about" data-nav="courses">For courses</a></li>
                            <li><a href="index.html#contact" data-nav="contact">Contact</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main class="explore-shell">
        <section class="explore-hero">
            <p class="eyebrow">Discover LiveView</p>
            <h1>Explore courses &amp; golfers</h1>
            <p class="lead">Browse the full directory, find golfers near you, and jump into live streams.</p>
        </section>

        <div class="explore-toolbar">
            <div class="explore-tabs" role="tablist" aria-label="Explore filters">
                <button type="button" class="explore-tab active" data-tab="courses" role="tab" aria-selected="true">Courses</button>
                <button type="button" class="explore-tab" data-tab="golfers" role="tab" aria-selected="false">Golfers</button>
                <button type="button" class="explore-tab" data-tab="live" role="tab" aria-selected="false">Live now</button>
            </div>
            <label class="explore-search">
                <span class="sr-only">Search</span>
                <input type="search" id="exploreSearch" placeholder="Search name, city, or state" autocomplete="off">
            </label>
        </div>

        <p id="exploreCount" class="explore-count" aria-live="polite"></p>

        <div id="exploreGrid" class="card-grid explore-grid">
            <div class="loading-state">Loading...</div>
        </div>
    </main>

    <script src="/liveview/config.js"></script>
    <script src="/liveview/auth-guard.js"></script>
    <script src="liveview-core.js"></script>
    <script src="social.js"></script>
    <script src="script.js"></script>
    <script src="site-chrome.js"></script>
    <script src="explore.js"></script>
    <script src="sw-register.js"></script>
</body>
</html>
